name: Build Flutter APK (Debug)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build Tag'
        required: true
        type: string
      release_url:
        description: 'URL Download ZIP'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ⭐ PERPANJANG TIMEOUT
    
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Source (Support file besar)
        run: |
          echo "📥 Downloading from: ${{ github.event.inputs.release_url }}"
          curl -L -o source.zip \
            --connect-timeout 300 \
            --max-time 3600 \
            --retry 3 \
            --retry-delay 5 \
            "${{ github.event.inputs.release_url }}"
          
          echo "📦 File size: $(du -sh source.zip | cut -f1)"
          mkdir project
          unzip -q source.zip -d project

      - name: Build APK
        run: |
          cd project
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: error
