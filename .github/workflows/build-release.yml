name: Build Flutter APK (Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build Tag'
        required: true
        type: string
      release_url:
        description: 'URL Download ZIP'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ⭐ PERPANJANG TIMEOUT JADI 60 MENIT
    
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Source (Support file besar)
        run: |
          echo "📥 Downloading from: ${{ github.event.inputs.release_url }}"
          # ⭐ PAKAI CURL DENGAN RESUME DAN TIMEOUT LEBIH LAMA
          curl -L -o source.zip \
            --connect-timeout 300 \
            --max-time 3600 \
            --retry 3 \
            --retry-delay 5 \
            "${{ github.event.inputs.release_url }}"
          
          echo "📦 File size: $(du -sh source.zip | cut -f1)"
          mkdir project
          unzip -q source.zip -d project
          echo "📂 Project extracted"

      - name: Build APK
        run: |
          cd project
          echo "📦 Getting dependencies..."
          flutter pub get
          echo "🔨 Building APK Release..."
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          # ⭐ TAMBAHKAN INI UNTUK FILE BESAR
          if-no-files-found: error
