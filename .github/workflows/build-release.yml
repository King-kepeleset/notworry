name: Build Flutter APK (Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build Tag'
        required: true
        type: string
      release_url:
        description: 'URL Download ZIP'
        required: true
        type: string
      build_type:                   
        description: 'Build Type'
        required: false
        type: string
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Source
        run: |
          curl -L -o source.zip "${{ github.event.inputs.release_url }}"
          mkdir project
          unzip -q source.zip -d project

      - name: Build APK
        run: |
          cd project
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
